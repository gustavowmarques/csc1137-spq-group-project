image: cypress/browsers:node-20.18.0-chrome-130.0.6723.69-1-ff-131.0.3-edge-130.0.2849.52-1

stages:
  - lint
  - test
  - build
  - deploy

variables:
  node_env: 'development'
  project_dir: 'Angular'

cache:
  paths:
    - $project_dir/node_modules/

before_script:
  - cd $project_dir
  - npm ci

# lint stage
lint:
  stage: lint
  script:
    - npm run lint
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'

# test stage
test:
  stage: test
  script:
    - npm run test -- --watch=false
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'

# build stage
build:
  stage: build
  script:
    - sed -i "s|<apiKey>|$apiKey|g" src/environments/environment.ts
    - sed -i "s|<authDomain>|$authDomain|g" src/environments/environment.ts
    - sed -i "s|<projectId>|$projectId|g" src/environments/environment.ts
    - sed -i "s|<storageBucket>|$storageBucket|g" src/environments/environment.ts
    - sed -i "s|<messagingSenderId>|$messagingSenderId|g" src/environments/environment.ts
    - sed -i "s|<appId>|$appId|g" src/environments/environment.ts
    - sed -i "s|<measurementId>|$measurementId|g" src/environments/environment.ts
    - npm run build -- --configuration production
  artifacts:
    paths:
      - $project_dir/dist/
    expire_in: 1 hour
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'

# deploy stage
deploy:
  stage: deploy
  image: node:20
  before_script:
    - cd $project_dir
    - npm install -g firebase-tools
  script:
    - firebase deploy --only hosting --token $FIREBASE_TOKEN --project $projectId
  dependencies:
    - build
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
  environment:
    name: production
    url: https://$projectId.web.app
<div class="page">
  <h2>Add Visit</h2>

  <form [formGroup]="form" (ngSubmit)="save()" class="form-card">
    <div class="field">
      <label>Clinical Notes *</label>
      <textarea formControlName="notes" rows="6" placeholder="Enter clinical notes..."></textarea>
      <span class="error" *ngIf="form.get('notes')?.touched && form.get('notes')?.hasError('required')">
        Notes are required.
      </span>
    </div>

    <div class="actions">
      <button type="submit" class="btn-primary" [disabled]="saving">
        {{ saving ? 'Saving...' : 'Save Visit' }}
      </button>
      <a [routerLink]="['/visits']" [queryParams]="{ patientId: patientId }" class="btn-cancel">Cancel</a>
    </div>
  </form>
</div>

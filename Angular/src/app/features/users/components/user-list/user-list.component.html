<div class="page">
  <h2>User Management</h2>

  <div class="activation">
    <h3>Add new user</h3>
    <div class="activation-form">
      <input
        type="email"
        [value]="activationEmail"
        (input)="activationEmail = $any($event.target).value"
        placeholder="user@example.com"
      />

      <app-role-select
        [value]="activationRole"
        (roleChange)="activationRole = $event"
      ></app-role-select>

      <button
        type="button"
        class="btn-activate"
        (click)="activateEmail()"
        [disabled]="activating"
      >
        {{ activating ? 'Adding...' : 'Add' }}
      </button>
    </div>

    <p class="message success" *ngIf="activationMessage">{{ activationMessage }}</p>
    <p class="message error" *ngIf="activationError">{{ activationError }}</p>
  </div>

  <table *ngIf="users$ | async as users">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users">
        <td>{{ user.displayName }}</td>
        <td>{{ user.email }}</td>
        <td>
          <app-role-select
            cssClass="role-select"
            [value]="user.role"
            [disabled]="updating[user.uid] || user.role === 'Admin'"
            (roleChange)="changeRole(user.uid, $event)"
          ></app-role-select>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div class="page">
  <h2>User Management</h2>

  <table *ngIf="users$ | async as users">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users">
        <td>{{ user.displayName }}</td>
        <td>{{ user.email }}</td>
        <td>
          <select
            class="role-select"
            [value]="user.role"
            (change)="changeRole(user.uid, $any($event.target).value)"
            [disabled]="updating[user.uid] || user.role === 'Admin'"
          >
            <option value="Doctor">Doctor</option>
            <option value="Nurse">Nurse</option>
            <option value="Admin">Admin</option>
          </select>
        </td>
      </tr>
    </tbody>
  </table>
</div>

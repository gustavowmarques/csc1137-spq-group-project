<div class="page">
  <h2>{{ isEditMode ? 'Edit Prescription' : 'Add Prescription' }}</h2>

  <div class="block-message" *ngIf="blockMessage">
    {{ blockMessage }}
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="form-card">
    <div class="field">
      <label>Medicine Name *</label>
      <input type="text" formControlName="drugName" list="medicine-options" placeholder="Search medicine" />
      <datalist id="medicine-options">
        <option *ngFor="let medicine of medicineOptions" [value]="medicine"></option>
      </datalist>
      <span class="error" *ngIf="form.get('drugName')?.touched && form.get('drugName')?.hasError('required')">
        Medicine name is required.
      </span>
    </div>

    <div class="field">
      <label>Start Date *</label>
      <input type="date" formControlName="startDate" [min]="todayDate" />
      <span class="error" *ngIf="form.get('startDate')?.touched && form.get('startDate')?.hasError('required')">
        Start date is required.
      </span>
      <span class="error" *ngIf="form.get('startDate')?.touched && form.get('startDate')?.hasError('beforeToday')">
        Start date cannot be in the past.
      </span>
    </div>

    <div class="field">
      <label>Number of Days *</label>
      <select formControlName="durationDays">
        <option *ngFor="let day of durationOptions" [ngValue]="day">{{ day }}</option>
      </select>
      <span class="error" *ngIf="form.get('durationDays')?.touched && form.get('durationDays')?.hasError('required')">
        Number of days is required.
      </span>
    </div>

    <div class="field">
      <label>Daily Dosage *</label>
      <select formControlName="dailyDosage">
        <option *ngFor="let dosage of dailyDosageOptions" [ngValue]="dosage">{{ dosage }}</option>
      </select>
      <span class="error" *ngIf="form.get('dailyDosage')?.touched && form.get('dailyDosage')?.hasError('required')">
        Daily dosage is required.
      </span>
    </div>

    <div class="actions">
      <button type="submit" class="btn-primary" [disabled]="saving">
        {{ saving ? 'Saving...' : (isEditMode ? 'Update Prescription' : 'Create Prescription') }}
      </button>
      <a [routerLink]="['/prescriptions']" [queryParams]="{ patientId: patientId }" class="btn-cancel">Cancel</a>
    </div>
  </form>
</div>

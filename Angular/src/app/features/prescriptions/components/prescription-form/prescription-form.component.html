<div class="page">
  <h2>New Prescription</h2>

  <div class="block-message" *ngIf="blockMessage">
    {{ blockMessage }}
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="form-card">
    <div class="field">
      <label>Medicine Name *</label>
      <input type="text" formControlName="drugName" placeholder="e.g. Aspirin" />
      <span class="error" *ngIf="form.get('drugName')?.touched && form.get('drugName')?.hasError('required')">
        Medicine name is required.
      </span>
    </div>

    <div class="field">
      <label>Start Date *</label>
      <input type="date" formControlName="startDate" />
      <span class="error" *ngIf="form.get('startDate')?.touched && form.get('startDate')?.hasError('required')">
        Start date is required.
      </span>
    </div>

    <div class="field">
      <label>End Date *</label>
      <input type="date" formControlName="endDate" />
      <span class="error" *ngIf="form.get('endDate')?.touched && form.get('endDate')?.hasError('required')">
        End date is required.
      </span>
      <span class="error" *ngIf="form.hasError('endDateBeforeStart')">
        End date must be after start date.
      </span>
    </div>

    <div class="actions">
      <button type="submit" class="btn-primary" [disabled]="saving">
        {{ saving ? 'Saving...' : 'Create Prescription' }}
      </button>
      <a [routerLink]="['/prescriptions']" [queryParams]="{ patientId: patientId }" class="btn-cancel">Cancel</a>
    </div>
  </form>
</div>

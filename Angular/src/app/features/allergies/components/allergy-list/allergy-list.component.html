<div class="page">
  <div class="header">
    <h2>Allergies</h2>
    <a *ngIf="canAdd && selectedPatientId" [routerLink]="['new']" [queryParams]="{ patientId: selectedPatientId }" class="btn-primary">+ Add Allergy</a>
  </div>

  <app-patient-select
    *ngIf="!hasPatientContext"
    [patients$]="patients$"
    [selectedPatientId]="selectedPatientId"
    (patientChange)="onPatientChange($event)"
    label="Select Patient">
  </app-patient-select>

  <table *ngIf="allergies$ | async as allergies">
    <thead>
      <tr>
        <th>Allergen</th>
        <th>Severity</th>
        <th>Added</th>
        <th *ngIf="isDoctor">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let allergy of allergies">
        <td>{{ allergy.allergen }}</td>
        <td>
          <span class="severity-badge" [ngClass]="{ 'severe': allergy.severity === 'Severe', 'mild': allergy.severity === 'Mild' }">
            {{ allergy.severity }}
          </span>
        </td>
        <td>{{ allergy.createdAt?.toDate() | date:'mediumDate' }}</td>
        <td *ngIf="isDoctor">
          <a [routerLink]="[allergy.id, 'edit']" [queryParams]="{ patientId: selectedPatientId }" class="btn-link">Edit</a>
          <button type="button" class="btn-delete" (click)="deleteAllergy(allergy)" [disabled]="!allergy.id || deleting[allergy.id]">
            {{ allergy.id && deleting[allergy.id] ? 'Deleting...' : 'Delete' }}
          </button>
        </td>
      </tr>
      <tr *ngIf="allergies.length === 0">
        <td [attr.colspan]="isDoctor ? 4 : 3" class="empty">No allergies found.</td>
      </tr>
    </tbody>
  </table>
</div>

<div class="page">
  <div class="header">
    <h2>Allergies</h2>
    <a *ngIf="canAdd && selectedPatientId" [routerLink]="['new']" [queryParams]="{ patientId: selectedPatientId }" class="btn-primary">+ Add Allergy</a>
  </div>

  <div class="field" *ngIf="!hasPatientContext">
    <label>Select Patient</label>
    <select (change)="onPatientChange($any($event.target).value)" [value]="selectedPatientId">
      <option value="">-- Select a patient --</option>
      <option *ngFor="let p of patients$ | async" [value]="p.id">{{ p.lastName }}, {{ p.firstName }}</option>
    </select>
  </div>

  <table *ngIf="allergies$ | async as allergies">
    <thead>
      <tr>
        <th>Allergen</th>
        <th>Severity</th>
        <th>Added</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let allergy of allergies">
        <td>{{ allergy.allergen }}</td>
        <td>
          <span class="severity-badge" [ngClass]="{ 'severe': allergy.severity === 'Severe', 'mild': allergy.severity === 'Mild' }">
            {{ allergy.severity }}
          </span>
        </td>
        <td>{{ allergy.createdAt?.toDate() | date:'mediumDate' }}</td>
      </tr>
      <tr *ngIf="allergies.length === 0">
        <td colspan="3" class="empty">No allergies found.</td>
      </tr>
    </tbody>
  </table>
</div>

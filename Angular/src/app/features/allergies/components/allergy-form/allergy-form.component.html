<div class="page">
  <h2>{{ isEdit ? 'Edit Allergy' : 'Add Allergy' }}</h2>

  <form [formGroup]="form" (ngSubmit)="save()" class="form-card">
    <div class="field">
      <label>Allergen *</label>
      <input type="text" formControlName="allergen" placeholder="e.g. Aspirin, Penicillin" />
      <span class="error" *ngIf="form.get('allergen')?.touched && form.get('allergen')?.hasError('required')">
        Allergen is required.
      </span>
    </div>

    <div class="field">
      <label>Severity *</label>
      <select formControlName="severity">
        <option *ngFor="let s of severities" [value]="s">{{ s }}</option>
      </select>
    </div>

    <div class="actions">
      <button type="submit" class="btn-primary" [disabled]="saving">
        {{ saving ? 'Saving...' : (isEdit ? 'Update Allergy' : 'Add Allergy') }}
      </button>
      <a [routerLink]="['/allergies']" [queryParams]="{ patientId: patientId }" class="btn-cancel">Cancel</a>
    </div>
  </form>
</div>
